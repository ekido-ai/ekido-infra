name: Deploy

# The server deploys itself: every 5 minutes it pins each repo in deploy.json to its newest green commit
# (server/ops/ekido-autodeploy.sh). GitHub holds no credential for it. This workflow waits for that deploy, then
# confirms the live site runs this repo's commit and is healthy. Other Ekido repos call it (workflow_call), so a
# merge in any repo shows when it is live.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  production:
    name: Live on ekido.duckdns.org
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://ekido.duckdns.org
    steps:
      - name: Wait for the server to deploy this commit
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 100); do
            v=$(curl -fsS --max-time 20 https://gpuchain.duckdns.org/deploy/version.json || echo '{}')
            live=$(jq -r --arg r "$REPO" '.repos[$r] // ""' <<<"$v")
            failed=$(jq -r --arg r "$REPO" '.failed_repos[$r] // ""' <<<"$v")
            if [ "$live" = "$SHA" ]; then
              echo "Live: $(jq -c . <<<"$v")"; exit 0
            fi
            if [ "$failed" = "$SHA" ]; then
              echo "::error::The server refused the release with this commit: $(jq -r '.failed_reason' <<<"$v")"; exit 1
            fi
            echo "Attempt $i: live is ${live:0:7}, waiting for ${SHA:0:7}"
            sleep 30
          done
          echo "::error::Not deployed within 50 minutes"; exit 1
      - name: Check the live site
        # The API answers on gpuchain.duckdns.org; the site's pages live on ekido.duckdns.org.
        run: |
          curl -fsS --max-time 20 https://gpuchain.duckdns.org/sepolia/readyz | jq -e '.status == "ready"'
          for p in / /chain /provide /dashboard; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://ekido.duckdns.org$p")
            echo "$p $code"; [ "$code" = 200 ]
          done
